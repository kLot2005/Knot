<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <header>
        <h1>Intelligence Dashboard</h1>
        <div class="stats">
            <div class="stat-card">
                <span id="totalClusters">0</span>
                <label>Active Clusters</label>
            </div>
            <div class="stat-card">
                <span id="totalUnclustered">0</span>
                <label>Unclustered News</label>
            </div>
        </div>
    </header>

    <main>
        <section class="board">
            <div class="board-header">
                <h2>Top Semantic Clusters</h2>
                <button class="refresh-btn" onclick="fetchData()">⟳ Refresh</button>
            </div>
            <div class="grid" id="clusterGrid">
                <!-- Clusters will be rendered here -->
                <div class="loading">Loading clusters...</div>
            </div>
        </section>

        <section class="board">
            <div class="board-header">
                <h2>Recent Unclustered News</h2>
            </div>
            <div class="list" id="unclusteredList">
                <!-- Unclustered items -->
                <div class="loading">Loading news...</div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
